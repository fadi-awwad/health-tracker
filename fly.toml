# Fly.io config. App name must be globally unique: change it, or let
# `fly launch --no-deploy` rewrite it (see README).
app = "fadi-health"
primary_region = "fra"

[build]

[env]
  DATABASE_PATH = "/data/app.db"

[[mounts]]
  source = "health_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/manifest.webmanifest"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
